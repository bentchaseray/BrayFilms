<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BentleyHQ">
<meta name="theme-color" content="#020617">
<title>BentleyHQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#020617;color:#F8FAFC;font-family:'Fira Sans',system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.5;overscroll-behavior:none}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(76px + env(safe-area-inset-bottom)) env(safe-area-inset-left);min-height:100vh}
header{position:sticky;top:0;background:rgba(2,6,23,.97);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:14px 16px 8px;border-bottom:1px solid #1E293B;z-index:100}
.brand{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.brand h1{font-family:'Fira Code',ui-monospace,monospace;font-size:17px;font-weight:700;letter-spacing:-.5px}
.brand .gold{color:#F59E0B}
.meta{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;color:#64748B}
.refresh{background:transparent;border:1px solid #334155;color:#64748B;padding:4px 12px;border-radius:20px;font-size:11px;cursor:pointer;font-family:inherit;transition:all .2s}
.refresh:active{background:#1E293B;color:#F59E0B;border-color:#F59E0B}
.refresh.spinning{color:#F59E0B;border-color:#F59E0B}
nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:4px 0 2px;margin:0 -16px;padding-left:16px;padding-right:16px}
nav::-webkit-scrollbar{display:none}
nav a{flex-shrink:0;padding:6px 14px;border-radius:20px;background:#0F172A;color:#64748B;font-size:12px;font-weight:600;text-decoration:none;white-space:nowrap;border:1px solid #1E293B;transition:all .2s}
nav a.active{background:#22C55E;color:#020617;border-color:#22C55E;box-shadow:0 0 10px rgba(34,197,94,.25)}
main{padding:16px}
.section{margin-bottom:32px;scroll-margin-top:120px}
.s-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid #1E293B}
.s-head h2{font-family:'Fira Code',ui-monospace,monospace;font-size:10px;font-weight:700;color:#F59E0B;letter-spacing:2px;text-transform:uppercase}
.s-head .tag{font-size:10px;color:#475569;letter-spacing:.5px}
.card{background:#0F172A;border:1px solid #1E293B;border-radius:16px;padding:16px;margin-bottom:10px;transition:border-color .2s}
.card.hot{border-color:#F59E0B;background:linear-gradient(160deg,rgba(245,158,11,.06),#0F172A)}
.card.gold-edge{border-left:3px solid #F59E0B}
.card.green-edge{border-left:3px solid #22C55E}
.row{display:flex;align-items:flex-start;gap:10px}
.row .icon{flex-shrink:0;font-size:18px;margin-top:1px}
.row .body{flex:1;min-width:0}
.title{font-size:14px;font-weight:600;color:#F8FAFC;line-height:1.35;margin-bottom:3px}
.sub{font-size:12px;color:#64748B;line-height:1.4}
.txt{font-size:13px;color:#CBD5E1;line-height:1.5}
.txt strong{color:#F8FAFC;font-weight:600}
.dim{font-size:11px;color:#475569;margin-top:4px}
.gold-txt{color:#F59E0B}
.green-txt{color:#22C55E}
.chev{color:#334155;font-size:14px;flex-shrink:0;margin-left:6px;transition:transform .25s;align-self:center}
.ex{cursor:pointer}
.ex.open .chev{transform:rotate(90deg)}
.ctx{max-height:0;overflow:hidden;transition:max-height .3s ease-out}
.ex.open .ctx{max-height:2000px}
.ctx-inner{padding:12px;background:#020617;border-radius:10px;margin-top:10px;font-size:12px;color:#94A3B8;line-height:1.6;border-left:3px solid #F59E0B}
.ctx-inner strong{color:#F59E0B;font-weight:600}
.chk{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;background:#0F172A;border:1px solid #1E293B;border-radius:12px;margin-bottom:8px;transition:border-color .2s}
.chk .box{flex-shrink:0;width:22px;height:22px;border:2px solid #334155;border-radius:6px;margin-top:1px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.chk.done .box{background:#22C55E;border-color:#22C55E;box-shadow:0 0 8px rgba(34,197,94,.35)}
.chk.done .box::after{content:"✓";color:#020617;font-weight:700;font-size:13px}
.chk.done .title{text-decoration:line-through;color:#475569}
.chk.done .sub{color:#334155}
.chk .body{flex:1}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:#0F172A;border:1px solid #1E293B;padding:14px 12px;border-radius:14px}
.stat .label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#64748B;margin-bottom:4px}
.stat .val{font-family:'Fira Code',ui-monospace,monospace;font-size:26px;font-weight:700;color:#F8FAFC;line-height:1}
.stat .val.gold{color:#F59E0B;text-shadow:0 0 24px rgba(245,158,11,.3)}
.stat .val.green{color:#22C55E;text-shadow:0 0 24px rgba(34,197,94,.3)}
.stat .num{font-family:'Fira Code',ui-monospace,monospace;font-size:26px;font-weight:700;color:#F8FAFC;line-height:1}
.stat .num.gold{color:#F59E0B;text-shadow:0 0 24px rgba(245,158,11,.3)}
.stat .lbl{font-size:10px;color:#64748B;text-transform:uppercase;letter-spacing:.6px;margin-top:4px}
.card h3{font-family:'Fira Code',ui-monospace,monospace;font-size:10px;font-weight:700;color:#F59E0B;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px}
.mrow{padding:10px 0;border-bottom:1px solid #1E293B;font-size:14px}
.mrow.ex{cursor:pointer}
.mrow:last-child{border-bottom:none}
.mrow-head{display:flex;justify-content:space-between;align-items:center}
.mrow .src{color:#CBD5E1;flex:1}
.mrow .amt{color:#F59E0B;font-weight:600;font-variant-numeric:tabular-nums;margin-left:8px;font-family:'Fira Code',ui-monospace,monospace}
.mrow .chev{color:#334155;font-size:14px;flex-shrink:0;margin-left:6px;transition:transform .25s}
.mrow.ex.open .chev{transform:rotate(90deg)}
.mrow .ctx{max-height:0;overflow:hidden;transition:max-height .3s ease-out}
.mrow.ex.open .ctx{max-height:2000px}
.mrow.total{border-top:1px solid #F59E0B;border-bottom:none;margin-top:6px;padding-top:12px;font-weight:700;cursor:default}
.mrow.total .src,.mrow.total .amt{color:#F59E0B;font-size:16px}
.tagm{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.6px;padding:3px 8px;border-radius:10px;text-transform:uppercase;margin-bottom:6px}
.tagm.live{background:#F59E0B;color:#020617}
.tagm.warm{background:transparent;color:#F59E0B;border:1px solid #F59E0B}
.tagm.draft{background:transparent;color:#64748B;border:1px solid #334155}
.tagm.booked{background:rgba(34,197,94,.12);color:#22C55E;border:1px solid rgba(34,197,94,.3)}
.dm-block{margin-top:10px;padding:12px;background:#020617;border-radius:10px;border:1px solid #1E293B;font-family:'Fira Code',ui-monospace,monospace;font-size:11px;color:#94A3B8;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.copy-btn{background:transparent;border:1px solid #334155;color:#64748B;padding:6px 12px;border-radius:8px;font-size:10px;cursor:pointer;margin-top:8px;font-family:inherit;letter-spacing:.5px;text-transform:uppercase;transition:all .2s}
.copy-btn:active,.copy-btn.copied{background:#22C55E;color:#020617;border-color:#22C55E}
.banner{background:linear-gradient(135deg,rgba(245,158,11,.07),rgba(2,6,23,.5));border:1px solid rgba(245,158,11,.3);padding:16px 16px 16px 20px;border-radius:16px;margin-bottom:20px;position:relative;overflow:hidden}
.banner::before{content:'';position:absolute;top:0;left:0;bottom:0;width:3px;background:linear-gradient(180deg,#F59E0B,rgba(245,158,11,.15))}
.banner .lbl{font-family:'Fira Code',ui-monospace,monospace;font-size:10px;font-weight:700;color:#F59E0B;letter-spacing:1.5px;margin-bottom:8px;text-transform:uppercase}
.banner .head{font-size:15px;color:#F8FAFC;line-height:1.45;font-weight:500}
footer{position:fixed;bottom:0;left:0;right:0;background:rgba(2,6,23,.98);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid #1E293B;padding:8px env(safe-area-inset-right) calc(8px + env(safe-area-inset-bottom)) env(safe-area-inset-left);display:grid;grid-template-columns:repeat(4,1fr);gap:6px;z-index:100}
footer a,footer button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px;text-decoration:none;border-radius:12px;background:#0F172A;border:1px solid #1E293B;cursor:pointer;font-family:inherit;transition:all .2s}
footer a:active,footer button:active{background:#1E293B}
footer button.active{background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.35)}
footer button.active .lab,footer button.active .ic{color:#22C55E}
footer .ic{font-size:18px;line-height:1}
footer .lab{font-size:10px;font-weight:600;color:#64748B;letter-spacing:.3px}
.page-head{display:flex;align-items:center;gap:10px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #1E293B}
.back-btn{background:transparent;border:1px solid #334155;color:#F59E0B;padding:7px 14px;border-radius:20px;font-size:12px;cursor:pointer;font-family:inherit;font-weight:600;transition:all .2s}
.back-btn:active{background:#F59E0B;color:#020617;border-color:#F59E0B}
.page-title{font-family:'Fira Code',ui-monospace,monospace;font-size:11px;font-weight:700;color:#F59E0B;letter-spacing:1.5px;text-transform:uppercase;flex:1}
.group-head{font-family:'Fira Code',ui-monospace,monospace;font-size:10px;font-weight:700;color:#64748B;letter-spacing:1.2px;text-transform:uppercase;margin:20px 0 8px;display:flex;align-items:center;gap:8px}
.group-head:first-child{margin-top:8px}
.group-head::after{content:'';flex:1;height:1px;background:#1E293B}
.group-ctx{font-size:11px;color:#475569;margin-bottom:10px;line-height:1.5}
.group-ctx strong{color:#F59E0B}
.empty{text-align:center;padding:40px 20px;color:#334155;font-size:13px}
.err-banner{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#FCA5A5;padding:10px 14px;border-radius:10px;margin-bottom:14px;font-size:12px;display:none}
.err-banner.show{display:block}
.loading{text-align:center;padding:60px 20px;color:#334155;font-size:13px}
.outcome-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);color:#22C55E;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.5px;margin-bottom:12px;font-family:'Fira Code',ui-monospace,monospace}
.indigo-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.indigo-item{background:#020617;border:1px solid #1E293B;border-radius:10px;padding:10px}
.indigo-item .il{color:#64748B;font-size:10px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:3px;font-family:'Fira Code',ui-monospace,monospace}
.indigo-item .iv{color:#F8FAFC;font-weight:600;font-size:12px;line-height:1.4}
@media(min-width:600px){body{max-width:480px;margin:0 auto;border-left:1px solid #1E293B;border-right:1px solid #1E293B}footer{max-width:480px;left:50%;transform:translateX(-50%)}}
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1><span class="gold">⚡</span> BentleyHQ <span class="gold" id="ver"></span></h1>
    <button class="refresh" id="refreshBtn" onclick="forceRefresh()">↻ Sync</button>
  </div>
  <div class="meta">
    <span id="metaLabel">Loading…</span>
    <span id="metaDate"></span>
  </div>
  <nav id="nav"></nav>
</header>

<main id="main">
  <div class="loading" id="loadingState">Loading dashboard…</div>
</main>

<footer id="footer"></footer>

<script>
"use strict";

const DATA_URL = "./data.json";
const KEY_DATA = "bhq.data";
const KEY_CHECKS = "bhq.checks";
const KEY_FETCH_TS = "bhq.fetchedAt";

const SECTIONS = [
  { id: "marcos", label: "📞 Marcos" },
  { id: "today",  label: "Today" },
  { id: "josh",   label: "Josh Prep" },
  { id: "week",   label: "Week" },
  { id: "money",  label: "Money" },
  { id: "pipeline", label: "Pipeline" },
  { id: "content",  label: "Content" },
  { id: "decisions", label: "Decisions" },
  { id: "goals",    label: "Goals" }
];

const VIEWS = [
  { id: "leadList",       label: "Leads",    icon: "🎯" },
  { id: "techChecklist",  label: "Tech",     icon: "⚙️" },
  { id: "outreach",       label: "Outreach", icon: "✉️" },
  { id: "contentPlanner", label: "Content+", icon: "📅" }
];

let currentView = "home";
let lastData = null;

// ---------- storage helpers ----------
function loadChecks() {
  try { return JSON.parse(localStorage.getItem(KEY_CHECKS) || "{}"); }
  catch (e) { return {}; }
}
function saveChecks(checks) {
  try { localStorage.setItem(KEY_CHECKS, JSON.stringify(checks)); } catch (e) {}
}
function loadCachedData() {
  try { return JSON.parse(localStorage.getItem(KEY_DATA) || "null"); }
  catch (e) { return null; }
}
function saveCachedData(data) {
  try {
    localStorage.setItem(KEY_DATA, JSON.stringify(data));
    localStorage.setItem(KEY_FETCH_TS, String(Date.now()));
  } catch (e) {}
}

// ---------- fetch ----------
async function fetchData() {
  const url = DATA_URL + "?t=" + Date.now();
  const res = await fetch(url, { cache: "no-store" });
  if (!res.ok) throw new Error("HTTP " + res.status);
  return await res.json();
}

async function load() {
  const cached = loadCachedData();
  if (cached) render(cached, { fromCache: true });
  try {
    const fresh = await fetchData();
    saveCachedData(fresh);
    render(fresh, { fromCache: false });
    hideError();
  } catch (err) {
    if (!cached) {
      document.getElementById("loadingState").innerHTML =
        "Couldn't load data.json.<br><span style='color:#64748B;font-size:11px'>" +
        escapeHTML(err.message) + "</span>";
    } else {
      showError("Sync failed — showing cached. " + err.message);
    }
  }
}

async function forceRefresh() {
  const btn = document.getElementById("refreshBtn");
  btn.classList.add("spinning");
  btn.textContent = "⟳ ...";
  try {
    const fresh = await fetchData();
    saveCachedData(fresh);
    render(fresh, { fromCache: false });
    hideError();
    btn.textContent = "✓ Synced";
    setTimeout(() => { btn.textContent = "↻ Sync"; btn.classList.remove("spinning"); }, 1200);
  } catch (err) {
    btn.textContent = "✗ Failed";
    showError("Sync failed: " + err.message);
    setTimeout(() => { btn.textContent = "↻ Sync"; btn.classList.remove("spinning"); }, 1800);
  }
}

function showError(msg) {
  let el = document.getElementById("errBanner");
  if (!el) {
    el = document.createElement("div");
    el.id = "errBanner";
    el.className = "err-banner";
    document.getElementById("main").prepend(el);
  }
  el.textContent = "⚠ " + msg;
  el.classList.add("show");
}
function hideError() {
  const el = document.getElementById("errBanner");
  if (el) el.classList.remove("show");
}

// ---------- escaping ----------
function escapeHTML(s) {
  if (s == null) return "";
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

// ---------- render ----------
function render(d, opts) {
  if (!d) return;
  lastData = d;
  document.getElementById("ver").textContent = d.meta?.version || "";
  document.getElementById("metaLabel").textContent = d.meta?.todayLabel || "";
  const dateEl = document.getElementById("metaDate");
  let dateText = d.meta?.lastUpdated || "";
  if (opts && opts.fromCache) dateText += " · cached";
  dateEl.textContent = dateText;

  document.getElementById("loadingState")?.remove?.();
  const main = document.getElementById("main");
  main.innerHTML = "";

  const nav = document.getElementById("nav");

  if (currentView === "home") {
    if (d.focus) main.appendChild(makeBanner(d.focus));
    nav.style.display = "";
    // Only show nav links for sections that have data
    const activeSections = SECTIONS.filter(s => {
      if (s.id === "marcos") return !!d.marcosCallPrep;
      if (s.id === "josh") return !!d.joshPrep;
      return true;
    });
    nav.innerHTML = activeSections.map(s =>
      `<a href="#${s.id}" data-id="${s.id}">${s.label}</a>`
    ).join("");
    if (d.marcosCallPrep) main.appendChild(makeMarcosCallPrep(d));
    main.appendChild(makeToday(d));
    if (d.joshPrep) main.appendChild(makeJoshPrep(d));
    main.appendChild(makeWeek(d));
    main.appendChild(makeMoney(d));
    main.appendChild(makePipeline(d));
    main.appendChild(makeContent(d));
    main.appendChild(makeDecisions(d));
    main.appendChild(makeGoals(d));
  } else {
    nav.style.display = "none";
    nav.innerHTML = "";
    const pageView = VIEWS.find(v => v.id === currentView);
    main.appendChild(makePageHead(pageView));
    if (currentView === "leadList")       main.appendChild(makeLeadList(d));
    if (currentView === "techChecklist")  main.appendChild(makeTechChecklist(d));
    if (currentView === "outreach")       main.appendChild(makeOutreachPage(d));
    if (currentView === "contentPlanner") main.appendChild(makeContentPlanner(d));
  }

  renderFooter();
  bindBehaviors();
  restoreChecks();
  if (currentView === "home") setActiveNavOnScroll();
}

function switchView(id) {
  currentView = id;
  if (lastData) render(lastData, { fromCache: false });
  window.scrollTo({ top: 0, behavior: "instant" });
}

function makePageHead(view) {
  const wrap = document.createElement("div");
  wrap.className = "page-head";
  wrap.innerHTML = `
    <button class="back-btn" onclick="switchView('home')">‹ Home</button>
    <span class="page-title">${escapeHTML(view.icon)} ${escapeHTML(view.label)}</span>`;
  return wrap;
}

function makeBanner(focus) {
  const wrap = document.createElement("div");
  wrap.className = "banner ex";
  wrap.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
      <div style="flex:1">
        <div class="lbl">🎯 Today's Focus</div>
        <div class="head">${escapeHTML(focus.headline || "")}</div>
      </div>
      <span class="chev">›</span>
    </div>
    <div class="ctx"><div class="ctx-inner">${focus.ctx || ""}</div></div>`;
  return wrap;
}

function sectionShell(id, title, tag) {
  const sec = document.createElement("section");
  sec.className = "section";
  sec.id = id;
  sec.innerHTML = `<div class="s-head"><h2>${escapeHTML(title)}</h2>${tag ? `<span class="tag">${escapeHTML(tag)}</span>` : ""}</div>`;
  return sec;
}

// TODAY
function makeToday(d) {
  const sec = sectionShell("today", "Today's Checklist", `${(d.checklist||[]).length} items`);
  (d.checklist || []).forEach(item => {
    const row = document.createElement("div");
    row.className = "chk ex";
    row.dataset.checkId = item.id;
    row.innerHTML = `
      <div class="box" data-action="toggle"></div>
      <div class="body">
        <div class="title">${escapeHTML(item.text || "")}</div>
        <div class="sub">${escapeHTML(item.sub || "")}</div>
        <div class="ctx"><div class="ctx-inner">${item.ctx || ""}</div></div>
      </div>
      <span class="chev">›</span>`;
    sec.appendChild(row);
  });
  return sec;
}

// MARCOS — post-call state if callOutcome exists, pre-call otherwise
function makeMarcosCallPrep(d) {
  const m = d.marcosCallPrep;
  if (!m) return document.createDocumentFragment();

  const isPostCall = !!m.callOutcome;
  const tagLabel = isPostCall ? "CALL COMPLETE ✓" : (m.tag || "TODAY");
  const sec = sectionShell("marcos", "📞 Marcos · Indigo Road", tagLabel);

  if (isPostCall) {
    const co = m.callOutcome;

    // Outcome card
    const card = document.createElement("div");
    card.className = "card green-edge";
    let html = `<div class="outcome-badge">✓ ${escapeHTML(co.status)}</div>`;
    html += `<div class="title" style="margin-bottom:10px">${escapeHTML(co.result || "")}</div>`;
    if ((co.keyMoments || []).length) {
      co.keyMoments.forEach(moment => {
        html += `<div style="display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #1E293B">
          <span style="color:#22C55E;flex-shrink:0;font-weight:700">›</span>
          <span style="font-size:13px;color:#CBD5E1;line-height:1.5">${escapeHTML(moment)}</span>
        </div>`;
      });
    }
    card.innerHTML = html;
    sec.appendChild(card);

    // Indigo scale grid
    if (co.indigoScale) {
      const is = co.indigoScale;
      const head = document.createElement("div");
      head.className = "group-head";
      head.textContent = "🏢 Indigo Road Scale";
      sec.appendChild(head);
      const grid = document.createElement("div");
      grid.className = "indigo-grid";
      const items = [
        { l: "Restaurants", v: is.restaurants },
        { l: "Hotels", v: is.hotels },
        { l: "Geography", v: is.geography },

  const tc = d.techChecklist || {};
  const sec = sectionShell("techChecklist", "Tech Stack", `${(tc.stats?.[0]?.value) || ""}`);
  if (tc.stats?.length) {
    const g = document.createElement("div");
    g.className = "stats";
    g.innerHTML = tc.stats.map(s => `<div class="stat"><div class="num ${s.gold ? "gold" : ""}">${escapeHTML(s.value)}</div><div class="lbl">${escapeHTML(s.label)}</div></div>`).join("");
    sec.appendChild(g);
  }
  (tc.items || []).forEach(item => {
    const c = document.createElement("div");
    c.className = "card ex";
    c.innerHTML = `<div class="row"><div class="body">${item.tag ? `<span class="tagm ${escapeHTML(item.tag)}">${escapeHTML(item.tagText || item.tag)}</span>` : ""}<div class="title">${escapeHTML(item.name || "")}</div><div class="sub">${escapeHTML(item.sub || "")}</div><div class="ctx"><div class="ctx-inner">${item.ctx || ""}</div></div></div><span class="chev">›</span></div>`;
    sec.appendChild(c);
  });
  if (!(tc.items || []).length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "No tech items.";
    sec.appendChild(empty);
  }
  return sec;
}

// ---------- behaviors ----------
function bindBehaviors() {
  document.querySelectorAll(".ex").forEach(el => {
    el.addEventListener("click", e => {
      const t = e.target;
      if (t.tagName === "A" || t.tagName === "BUTTON") return;
      if (t.dataset.action === "toggle") return;
      if (t.closest("[data-copy]")) return;
      if (t.closest(".dm-block")) return;
      el.classList.toggle("open");
    });
  });
  document.querySelectorAll('[data-action="toggle"]').forEach(box => {
    box.addEventListener("click", e => {
      e.stopPropagation();
      const row = box.closest(".chk");
      row.classList.toggle("done");
      const id = row.dataset.checkId;
      if (!id) return;
      const checks = loadChecks();
      checks[id] = row.classList.contains("done");
      saveChecks(checks);
    });
  });
  document.querySelectorAll("[data-copy]").forEach(btn => {
    btn.addEventListener("click", async e => {
      e.stopPropagation();
      const block = btn.parentElement.querySelector("[data-dm]");
      if (!block) return;
      try {
        await navigator.clipboard.writeText(block.textContent);
        btn.classList.add("copied");
        const orig = btn.textContent;
        btn.textContent = "✓ Copied";
        setTimeout(() => { btn.textContent = orig; btn.classList.remove("copied"); }, 1400);
      } catch (err) {
        btn.textContent = "Copy failed";
      }
    });
  });
  document.querySelectorAll("nav a").forEach(a => {
    a.addEventListener("click", e => {
      e.preventDefault();
      const id = a.getAttribute("href").slice(1);
      const target = document.getElementById(id);
      if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
    });
  });
}

function restoreChecks() {
  const checks = loadChecks();
  document.querySelectorAll(".chk[data-check-id]").forEach(row => {
    const id = row.dataset.checkId;
    if (checks[id]) row.classList.add("done");
  });
}

function setActiveNavOnScroll() {
  const links = Array.from(document.querySelectorAll("nav a"));
  const sections = links.map(a => document.getElementById(a.dataset.id)).filter(Boolean);
  function update() {
    const y = window.scrollY + 180;
    let active = sections[0];
    for (const s of sections) {
      if (s.offsetTop <= y) active = s;
    }
    links.forEach(a => a.classList.toggle("active", a.dataset.id === active?.id));
  }
  window.addEventListener("scroll", update, { passive: true });
  update();
}
